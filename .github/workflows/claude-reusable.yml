name: Claude Code (Reusable)

# MNML-LLC 全リポ共通マスターワークフロー。
# 各リポの claude.yml から uses: MNML-LLC/.github/.github/workflows/claude-reusable.yml@main で呼ぶ。

on:
  workflow_call:
    inputs:
      extra_claude_args:
        description: 'Additional claude CLI args (e.g. extra allowed tools)'
        required: false
        default: ''
        type: string
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true
      GH_ADMIN_PAT:
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  claude:
    if: |
      (github.event_name == 'issues' && contains(github.event.issue.body, '@claude')) ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GITHUB_TOKEN / GitHub App token では .github/workflows/ 配下を含む push が
      # 必ず拒否される (permissions: に `workflows: write` というキーは存在せず、
      # 書くとワークフロー自体が構文エラーになる)。回避には workflow スコープ付き
      # classic PAT (GH_ADMIN_PAT) が必須 (Issue #882)。
      - name: Warn if GH_ADMIN_PAT is missing
        env:
          HAS_PAT: ${{ secrets.GH_ADMIN_PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::warning::GH_ADMIN_PAT が未設定のため github.token にフォールバックします。.github/workflows/ 配下のファイルを含む push は拒否されます (Issue #882)"
          fi

      # PRコメント経由の実行では claude-code-action が PR ブランチへ checkout する。
      # 注入で dirty になった状態で別ブランチへ checkout すると失敗するため、
      # 注入より先に PR ブランチへ切り替えておく（action 内の checkout は no-op になる）。
      - name: Checkout PR branch (PR comment runs)
        if: |
          (github.event_name == 'issue_comment' && github.event.issue.pull_request != null) ||
          github.event_name == 'pull_request_review_comment'
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_PAT || github.token }}
        run: |
          # pull_request_review_comment イベントでは head.ref が取得できる
          PR_BRANCH="${{ github.event.pull_request.head.ref }}"
          # issue_comment イベントには pull_request ペイロードが無いため
          # gh api で PR の head.ref を解決する（issue.number == PR番号）
          if [[ -z "$PR_BRANCH" ]]; then
            PR_BRANCH=$(gh api "repos/${{ github.repository }}/pulls/${{ github.event.issue.number }}" --jq .head.ref 2>/dev/null || true)
          fi
          if [[ -n "$PR_BRANCH" ]]; then
            git fetch origin "$PR_BRANCH"
            git checkout "$PR_BRANCH"
          else
            echo "WARN: PR ブランチを特定できませんでした。checkout をスキップします"
          fi

      - name: Inject MNML company policy and dev rules into CLAUDE.md
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_PAT || github.token }}
        run: |
          # 会社方針 (mnml-agents root CLAUDE.md)
          POLICY=$(gh api repos/MNML-LLC/mnml-agents/contents/CLAUDE.md \
            --jq '.content' 2>/dev/null | base64 -d 2>/dev/null) || true
          # 開発ルール (mnml-agents agents/CLAUDE.md)
          DEV_RULES=$(gh api repos/MNML-LLC/mnml-agents/contents/agents/CLAUDE.md \
            --jq '.content' 2>/dev/null | base64 -d 2>/dev/null) || true
          # 取得失敗等でコンテンツが空のセクションはヘッダーごとスキップする。
          # 空の「（自動注入）」見出しだけが CLAUDE.md に残り、ベンダーの
          # コミットに混入する再発を防ぐ (Issue #1062, events PR #85)。
          POLICY_OK=false
          DEV_RULES_OK=false
          if [ -n "${POLICY//[[:space:]]/}" ]; then POLICY_OK=true; fi
          if [ -n "${DEV_RULES//[[:space:]]/}" ]; then DEV_RULES_OK=true; fi
          if [ "$POLICY_OK" = false ] && [ "$DEV_RULES_OK" = false ]; then
            echo "::warning::Company policy and dev rules are both empty; skipping injection (CLAUDE.md left untouched)"
            exit 0
          fi
          if [ "$POLICY_OK" = false ]; then
            echo "::warning::Company policy is empty; skipping its section"
          fi
          if [ "$DEV_RULES_OK" = false ]; then
            echo "::warning::Dev rules are empty; skipping its section"
          fi
          touch CLAUDE.md
          {
            if [ "$POLICY_OK" = true ]; then
              printf '\n\n---\n# MNML 会社方針（自動注入）\n\n'
              printf '%s\n' "$POLICY"
            fi
            if [ "$DEV_RULES_OK" = true ]; then
              printf '\n---\n# MNML 開発ルール（自動注入）\n\n'
              printf '%s\n' "$DEV_RULES"
            fi
          } >> CLAUDE.md
          LINES=$(wc -l < CLAUDE.md)
          echo "✓ Injected sections (policy=${POLICY_OK}, dev_rules=${DEV_RULES_OK}, ${LINES} total lines in CLAUDE.md)"

      # 実装クラフト3スキルを first-party (MNML-LLC/mnml-agents) から sha ピン止めで取得し、
      # ランナーの .claude/skills/ に展開する (設計: mnml-agents#1125 案D / Issue #19)。
      # - 取得は上の CLAUDE.md 注入と同じ gh api の信頼境界を使う (first-party のみ)。
      #   external marketplace からの実行時取得は禁止 (供給網リスク対策)。
      # - claude-code-action 起動"前"の素の bash ステップで書き込む
      #   (エージェントセッション内書き込みガードの対象外)。
      # - 取得失敗は graceful skip (warning を出しつつベンダー実行は継続)。
      # - 既存ディレクトリは上書きで冪等。
      - name: Fetch MNML implementation-craft skills (sha-pinned, first-party)
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_PAT || github.token }}
        run: |
          # ピン止め sha (更新時はこの定数を変える sha 変更 PR の差分レビューを経る)。
          # 2026-08-21 時点の mnml-agents origin/main HEAD。設計時 sha 8a2e1fc5 と
          # 当該3スキルの SKILL.md blob は同一 (差分は PROVENANCE.md 追加のみ)。
          SKILLS_SHA="c290e64d07841e561773d2c8c0949e2b8ffddf1c"
          SKILLS="test-driven-development executing-plans subagent-driven-development"

          TARBALL="$(mktemp)"
          if ! gh api "repos/MNML-LLC/mnml-agents/tarball/${SKILLS_SHA}" > "$TARBALL" 2>/dev/null; then
            echo "::warning::Failed to fetch mnml-agents tarball @ ${SKILLS_SHA}; skipping skill injection (vendor run continues)"
            rm -f "$TARBALL"
            exit 0
          fi

          EXTRACT_DIR="$(mktemp -d)"
          if ! tar -xzf "$TARBALL" -C "$EXTRACT_DIR" 2>/dev/null; then
            echo "::warning::Failed to extract mnml-agents tarball; skipping skill injection (vendor run continues)"
            rm -rf "$TARBALL" "$EXTRACT_DIR"
            exit 0
          fi

          # tarball のトップは <owner>-<repo>-<shortsha>/ の単一ディレクトリ
          ROOT="$(find "$EXTRACT_DIR" -maxdepth 1 -mindepth 1 -type d | head -1)"
          SRC_BASE="${ROOT}/docs/skills-drafts"

          mkdir -p .claude/skills
          INJECTED=0
          for s in $SKILLS; do
            if [ -d "${SRC_BASE}/${s}" ]; then
              rm -rf ".claude/skills/${s}"          # 冪等: 既存を上書き
              cp -R "${SRC_BASE}/${s}" ".claude/skills/${s}"
              echo "✓ Injected skill: ${s}"
              INJECTED=$((INJECTED + 1))
            else
              echo "::warning::Skill dir not found in tarball: ${s} (skipped)"
            fi
          done

          rm -rf "$TARBALL" "$EXTRACT_DIR"

          if [ "$INJECTED" -eq 0 ]; then
            echo "::warning::No implementation-craft skills injected; vendor run continues without them"
          else
            echo "✓ ${INJECTED} implementation-craft skill(s) injected into .claude/skills/ @ ${SKILLS_SHA}"
          fi

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GH_ADMIN_PAT || github.token }}
          claude_args: "--model claude-opus-4-7 --allowed-tools 'Bash(npm*),Bash(npx*),Bash(node*),Bash(yarn*),Bash(pnpm*),Bash(uv*),Bash(python*),Bash(python3*),Bash(pip*),Bash(ruff*),Bash(make*),Bash(git*)' ${{ inputs.extra_claude_args }}"

      - name: Notify failure
        if: failure() && steps.claude.conclusion == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_PAT || github.token }}
          ISSUE_NUM: ${{ github.event.issue.number || github.event.comment.issue.number }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue comment "$ISSUE_NUM" --repo "$REPO" \
            --body "❌ Claude の実行が失敗しました。[ログを確認してください](${RUN_URL})"

      - name: Auto-create PR (if claude branch exists)
        id: pr-create
        # Issue コンテキスト (Issue 新規作成 or 既存 Issue へのコメント) でのみ実行。
        # PR へのコメント (issue.pull_request が存在) は既存 PR ブランチへの push なので対象外。
        if: |
          github.event_name == 'issues' ||
          (github.event_name == 'issue_comment' && !github.event.issue.pull_request)
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_PAT || github.token }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          REPO: ${{ github.repository }}
        run: |
          # 再委譲で同一 Issue のブランチが複数ある場合に備え、
          # タイムスタンプ suffix の辞書順で最新のブランチを選ぶ
          BRANCH=$(gh api "repos/${REPO}/branches" --paginate \
            --jq ".[] | select(.name | startswith(\"claude/issue-${ISSUE_NUM}-\")) | .name" \
            | sort -r | head -1)

          if [ -z "$BRANCH" ]; then
            echo "No claude branch for issue #${ISSUE_NUM}, skipping PR creation"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Found branch: $BRANCH"

          EXISTING=$(gh pr list --repo "$REPO" --head "$BRANCH" --state open \
            --json number --jq '.[0].number' 2>/dev/null || echo "")
          if [ -n "$EXISTING" ]; then
            echo "PR already exists: #$EXISTING"
            echo "pr_number=$EXISTING" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # main に対して差分のない残骸ブランチ (マージ済み等) では PR を作らない
          AHEAD=$(gh api "repos/${REPO}/compare/main...${BRANCH}" --jq '.ahead_by' 2>/dev/null || echo 0)
          if [ "${AHEAD:-0}" -eq 0 ]; then
            echo "Branch $BRANCH has no commits ahead of main; skipping PR creation"
            echo "pr_number=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PR_URL=$(gh pr create \
            --repo "$REPO" \
            --base main \
            --head "$BRANCH" \
            --title "$ISSUE_TITLE" \
            --body "Closes #${ISSUE_NUM}")
          PR_NUM=$(echo "$PR_URL" | rev | cut -d/ -f1 | rev)
          echo "Created PR #${PR_NUM} ($PR_URL)"
          echo "pr_number=${PR_NUM}" >> "$GITHUB_OUTPUT"

          # 作成した PR URL を Issue にコメントで通知
          gh issue comment "$ISSUE_NUM" --repo "$REPO" \
            --body "🔀 PR を自動作成しました: ${PR_URL}"

      - name: Auto-merge (if labeled, after CI)
        if: |
          (github.event_name == 'issues' ||
           (github.event_name == 'issue_comment' && !github.event.issue.pull_request)) &&
          contains(github.event.issue.labels.*.name, 'auto-merge') &&
          steps.pr-create.outputs.pr_number != ''
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_PAT || github.token }}
          PR_NUM: ${{ steps.pr-create.outputs.pr_number }}
          ISSUE_NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "Waiting for CI checks to register on PR #${PR_NUM}..."

          # CI未登録レース対策 (#15): チェック件数が0の間は最大90秒リトライして待つ。
          # PR作成直後は checks が未登録なことがあり、即マージすると無検証マージになる。
          # 90秒待っても0件のときだけ本当にCI無しと判定する。
          CHECK_COUNT=0
          for i in $(seq 1 10); do
            CHECK_JSON=$(gh pr checks "$PR_NUM" --repo "$REPO" --json name 2>/dev/null || echo '[]')
            CHECK_COUNT=$(echo "$CHECK_JSON" | jq 'length' 2>/dev/null || echo 0)
            CHECK_COUNT=${CHECK_COUNT:-0}
            if [ "$CHECK_COUNT" -gt 0 ]; then
              break
            fi
            if [ "$i" -lt 10 ]; then
              echo "No checks registered yet (attempt ${i}/10); waiting 10s..."
              sleep 10
            fi
          done

          if [ "$CHECK_COUNT" -eq 0 ]; then
            echo "No CI checks configured on this repo after ~90s; proceeding with merge"
          else
            if ! gh pr checks "$PR_NUM" --repo "$REPO" --watch --interval 10; then
              echo "CI failed; not merging PR #${PR_NUM}"
              exit 1
            fi
            echo "All checks passed."
          fi

          # マージ失敗時の無言滞留対策 (#15): コンフリクト等で失敗したら
          # 失敗内容をPRにコメントして可視化し、@claude に復旧を依頼する。
          echo "Squash merging PR #${PR_NUM}"
          if ! MERGE_OUT=$(gh pr merge "$PR_NUM" --repo "$REPO" --squash --delete-branch 2>&1); then
            echo "Auto-merge failed for PR #${PR_NUM}:"
            printf '%s\n' "$MERGE_OUT"
            gh pr comment "$PR_NUM" --repo "$REPO" --body "$(printf '⚠️ auto-merge に失敗しました（無言滞留防止 #15）。\n\n```\n%s\n```\n\n@claude origin/main を取り込んでコンフリクトを解消し push してください。' "$MERGE_OUT")"
            exit 1
          fi
          echo "Merged PR #${PR_NUM}"

  close-issue-on-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
    steps:
      - name: Close linked issue
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          REPO: ${{ github.repository }}
        run: |
          ISSUE_NUM=$(printf '%s' "$PR_BODY" | grep -oP '(?i)(?<=closes #)\d+' | head -1)
          if [ -z "$ISSUE_NUM" ]; then
            ISSUE_NUM=$(printf '%s' "$HEAD_REF" | grep -oP '(?<=issue-)\d+' || true)
          fi
          if [ -z "$ISSUE_NUM" ]; then
            echo "No linked issue found; skipping"
            exit 0
          fi
          echo "Closing issue #${ISSUE_NUM} (merged by PR #${PR_NUM})"
          gh issue close "$ISSUE_NUM" --repo "$REPO" \
            --comment "PR #${PR_NUM} がマージされたため自動クローズしました。"

  retry-merge:
    if: |
      github.event_name == 'issue_comment' &&
      contains(github.event.comment.body, '/retry-merge') &&
      github.event.issue.pull_request != null
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: read
    steps:
      - name: Retry auto-merge
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_PAT || github.token }}
          PR_NUM: ${{ github.event.issue.number }}
          REPO: ${{ github.repository }}
        run: |
          echo "Retrying auto-merge for PR #${PR_NUM}..."

          # CI未登録レース対策 (#15): チェック件数が0の間は最大90秒リトライして待つ。
          CHECK_COUNT=0
          for i in $(seq 1 10); do
            CHECK_JSON=$(gh pr checks "$PR_NUM" --repo "$REPO" --json name 2>/dev/null || echo '[]')
            CHECK_COUNT=$(echo "$CHECK_JSON" | jq 'length' 2>/dev/null || echo 0)
            CHECK_COUNT=${CHECK_COUNT:-0}
            if [ "$CHECK_COUNT" -gt 0 ]; then
              break
            fi
            if [ "$i" -lt 10 ]; then
              echo "No checks registered yet (attempt ${i}/10); waiting 10s..."
              sleep 10
            fi
          done

          if [ "$CHECK_COUNT" -eq 0 ]; then
            echo "No CI checks configured on this repo after ~90s; proceeding with merge"
          else
            if ! gh pr checks "$PR_NUM" --repo "$REPO" --watch --interval 10; then
              echo "CI failed; not merging PR #${PR_NUM}"
              exit 1
            fi
            echo "All checks passed."
          fi

          # マージ失敗時の無言滞留対策 (#15): 失敗内容をPRにコメントして可視化する。
          echo "Squash merging PR #${PR_NUM}"
          if ! MERGE_OUT=$(gh pr merge "$PR_NUM" --repo "$REPO" --squash --delete-branch 2>&1); then
            echo "Retry auto-merge failed for PR #${PR_NUM}:"
            printf '%s\n' "$MERGE_OUT"
            gh pr comment "$PR_NUM" --repo "$REPO" --body "$(printf '⚠️ /retry-merge も失敗しました（無言滞留防止 #15）。\n\n```\n%s\n```\n\n@claude origin/main を取り込んでコンフリクトを解消し push してください。' "$MERGE_OUT")"
            exit 1
          fi
          echo "Merged PR #${PR_NUM}"
